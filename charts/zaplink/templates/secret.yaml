{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zaplink.fullname" . }}
  labels:
    {{- include "zaplink.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ include "zaplink.envValue" $value }}
  {{- end }}
{{- end }}
